[project]
name = "geograph-rag-backend"
version = "0.1.0"
description = "Backend for GeoGraph-RAG geological exploration prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "langchain>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-neo4j>=0.1.0",
    "langgraph>=0.0.60",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "neo4j>=5.20.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
